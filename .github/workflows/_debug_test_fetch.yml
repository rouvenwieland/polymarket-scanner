name: Debug - Test Keyset Fetch

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests pandas

      - name: Fetch testen (ignoriert Nachtfenster)
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          import polymarket_snapshot as s

          markets = s.fetch_all_open_markets()
          print(f"Anzahl geladener aktiver Märkte: {len(markets)}")

          hits = 0
          for m in markets:
              parsed = s.parse_prices(m)
              if parsed is None:
                  continue
              yes_p, no_p = parsed
              if yes_p + no_p < s.THRESHOLD:
                  hits += 1
                  print(f"TREFFER: {m.get('question')} -> yes={yes_p} no={no_p} summe={yes_p+no_p}")
          print(f"Treffer unter Schwelle {s.THRESHOLD}: {hits}")
          EOF
