name: Multi-Platform Scan

on:
  schedule:
    # Kalshi + PredictIt sind deutlich kleiner als Polymarkts ~200k Märkte,
    # ein Lauf sollte also schneller sein als der große Polymarket-Scan -
    # trotzdem bewusst kein engerer Takt als der Haupt-Scan, um die
    # zusätzliche Last/API-Last auf Kalshi/PredictIt gering zu halten.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Gleiche concurrency-Gruppe wie die bestehenden Polymarket-Workflows: alle
# committen in dasselbe data/-Verzeichnis per "git add data/". Auch wenn die
# Dateien selbst nicht überlappen, lehnt git push einen non-fast-forward-Push
# ab, sobald ein anderer Workflow dazwischen schon gepusht hat - daher
# dieselbe Gruppe statt einer eigenen, damit sich die Läufe nicht
# gegenseitig die Pushes wegschnappen.
concurrency:
  group: polymarket-data-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        # fastembed: lokales Embedding-Modell für semantisches Cross-Platform-
        # Matching (siehe scripts/embeddings.py) - kein API-Key, reine
        # ONNX-CPU-Inferenz, bewusst NICHT sentence-transformers (zieht sonst
        # einen vollen GPU-Torch-Build, ca. 1GB+ statt ~200-250MB).
        run: pip install requests pandas fastembed

      - name: Embedding-Modell vorab cachen
        # Lädt die Modellgewichte einmal in den Actions-Cache (keyed auf den
        # Modellnamen, der sich praktisch nie ändert) - ohne Cache würde
        # JEDER 15-Minuten-Lauf das Modell erneut von HuggingFace herunterladen.
        # fastembeds Standard-Cache-Pfad ist $TMPDIR/fastembed_cache, auf
        # GitHub-Actions-Runnern also /tmp/fastembed_cache (verifiziert gegen
        # fastembed.common.utils - kein konfigurierbarer ~/.cache-Pfad).
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5

      - name: Multi-Platform-Scan ausführen
        # OPENROUTER_API_KEY (optional, Repository-Secret): letzte KI-
        # Prüfstufe vor einem Cross-Platform-Kauf (siehe scripts/llm_verify.py).
        # Ohne gesetzten Secret bleibt jeder Kandidat unverifiziert - es wird
        # dann gar nicht gekauft (fail-closed), aber der restliche Scan
        # (Datenerfassung, Single-Platform-Fonds, Dashboard-Daten) läuft
        # unverändert weiter.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/multi_platform_scan.py

      - name: Ergebnisse committen
        run: |
          mkdir -p data
          git config user.name "polymarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Multi-Platform-Scan $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
