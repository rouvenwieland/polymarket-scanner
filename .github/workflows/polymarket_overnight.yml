name: Polymarket Scan

on:
  schedule:
    # Läuft rund um die Uhr. Ein voller Durchlauf (Keyset-Pagination über
    # alle offenen Märkte) dauert inzwischen ~11 Minuten, daher 15-Minuten-
    # Takt statt 10 - sonst reihen sich die Läufe unnötig in der Warteschlange.
    # ALT: "*/15 * * * *" -> NEU: alle 3 h zur Minute :47. Real laeuft dieser Schedule im Median alle ~4,8 h.
    - cron: "47 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Gleiche concurrency-Gruppe wie fund_watch.yml: beide Workflows committen
# in dasselbe data/-Verzeichnis, ohne gemeinsame Gruppe könnten sich ihre
# Pushes gegenseitig als "non-fast-forward" ablehnen. Mit cancel-in-progress
# false wartet der jeweils andere Lauf einfach, statt parallel zu starten.
concurrency:
  group: polymarket-data-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Ohne Timeout gilt das 360-min-Standardlimit; ein haengender Lauf wuerde wegen der
    # gemeinsamen Concurrency-Gruppe alle anderen Workflows bis dahin blockieren.
    timeout-minutes: 60
    steps:
      - name: Repo auschecken
        # ref: main = aktuelle Branch-Spitze beim START des Laufs statt des SHA vom Ausloesezeitpunkt.
        # Ein geplanter Lauf, der in der Concurrency-Gruppe hinter einem anderen wartet, rechnet sonst
        # auf altem Stand und scheitert beim Rebase an Inhaltskonflikten (Cross-Watch hinter
        # Multi-Platform Scan, 11.-18.10.2026). Die Gruppe serialisiert nur, sie aktualisiert nichts.
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests pandas

      - name: Snapshot ausführen
        run: python scripts/polymarket_snapshot.py

      - name: Ergebnisse committen
        # Retry mit Rebase statt direktem Abbruch bei non-fast-forward -
        # siehe multi_platform_scan.yml für die ausführliche Begründung.
        run: |
          mkdir -p data
          git config user.name "polymarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5) - hole aktuellen main-Stand und versuche erneut..."
            if ! git pull --rebase origin main; then
              echo "Rebase auf origin/main fehlgeschlagen (Inhaltskonflikt?). Konfliktdateien:" >&2
              git diff --name-only --diff-filter=U >&2 || true
              git rebase --abort || true
              echo "Rebase abgebrochen, nichts gepusht. Hat ein anderer Lauf dieselben data/-Dateien geschrieben?" >&2
              exit 1
            fi
            sleep 3
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen." >&2
          exit 1
