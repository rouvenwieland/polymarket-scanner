name: Polymarket Overnight Scan

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Ein voller Scan-Durchlauf (Keyset-Pagination über alle offenen Märkte)
# kann inzwischen mehrere Minuten dauern. Ohne concurrency-Guard könnten
# sich zwei Cron-Läufe überlappen und sich beim Commit/Push in die Quere
# kommen - stattdessen wird ein laufender Lauf zu Ende geführt, bevor der
# nächste startet.
concurrency:
  group: polymarket-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests pandas

      - name: Snapshot ausführen
        run: python scripts/polymarket_snapshot.py

      - name: Ergebnisse committen
        run: |
          mkdir -p data
          git config user.name "polymarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
