name: Polymarket Scan

on:
  schedule:
    # Läuft rund um die Uhr. Ein voller Durchlauf (Keyset-Pagination über
    # alle offenen Märkte) dauert inzwischen ~11 Minuten, daher 15-Minuten-
    # Takt statt 10 - sonst reihen sich die Läufe unnötig in der Warteschlange.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Gleiche concurrency-Gruppe wie fund_watch.yml: beide Workflows committen
# in dasselbe data/-Verzeichnis, ohne gemeinsame Gruppe könnten sich ihre
# Pushes gegenseitig als "non-fast-forward" ablehnen. Mit cancel-in-progress
# false wartet der jeweils andere Lauf einfach, statt parallel zu starten.
concurrency:
  group: polymarket-data-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests pandas

      - name: Snapshot ausführen
        run: python scripts/polymarket_snapshot.py

      - name: Ergebnisse committen
        run: |
          mkdir -p data
          git config user.name "polymarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
