name: Cross-Platform-Fonds-Watch

on:
  schedule:
    # ALT: "*/5 * * * *" -> NEU: alle 2 h zur Minute :37 (Begruendung siehe fund_watch.yml;
    # versetzt zu fund_watch, damit beide nicht gleichzeitig in der Gruppe ankommen).
    - cron: "37 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Gleiche Gruppe wie polymarket_overnight.yml - siehe Kommentar dort.
concurrency:
  group: polymarket-data-write
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Ohne Timeout gilt das 360-min-Standardlimit; ein haengender Lauf wuerde wegen der
    # gemeinsamen Concurrency-Gruppe alle anderen Workflows bis dahin blockieren.
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        # ref: main = aktuelle Branch-Spitze beim START des Laufs statt des SHA vom Ausloesezeitpunkt.
        # Ein geplanter Lauf, der in der Concurrency-Gruppe hinter einem anderen wartet, rechnet sonst
        # auf altem Stand und scheitert beim Rebase an Inhaltskonflikten (Cross-Watch hinter
        # Multi-Platform Scan, 11.-18.10.2026). Die Gruppe serialisiert nur, sie aktualisiert nichts.
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Offene Cross-Platform-Positionen prüfen
        run: python scripts/cross_platform_watch.py

      - name: Ergebnisse committen
        # Retry mit Rebase statt direktem Abbruch bei non-fast-forward -
        # vier Workflows (dieser, fund_watch, polymarket_overnight,
        # multi_platform_scan) committen in dieselbe main-Branch; ein
        # dazwischen gepushter Commit eines anderen Laufs macht den
        # eigenen Push sonst garantiert non-fast-forward (siehe
        # multi_platform_scan.yml für die ausführliche Begründung).
        run: |
          mkdir -p data
          git config user.name "polymarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Cross-Platform-Fonds-Watch $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5) - hole aktuellen main-Stand und versuche erneut..."
            if ! git pull --rebase origin main; then
              echo "Rebase auf origin/main fehlgeschlagen (Inhaltskonflikt?). Konfliktdateien:" >&2
              git diff --name-only --diff-filter=U >&2 || true
              git rebase --abort || true
              echo "Rebase abgebrochen, nichts gepusht. Hat ein anderer Lauf dieselben data/-Dateien geschrieben?" >&2
              exit 1
            fi
            sleep 3
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen." >&2
          exit 1
